{% if asset.pk in favoritos_ids %}<button type="button" class="estrela ligada" data-favorito="{% url 'favorito_alternar' asset.pk %}" aria-pressed="true" title="Remover {{ asset.symbol }} dos favoritos">★</button>{% else %}<button type="button" class="estrela" data-favorito="{% url 'favorito_alternar' asset.pk %}" aria-pressed="false" title="Adicionar {{ asset.symbol }} aos favoritos">☆</button>{% endif %}
